; OPC DA Collector 配置模板（全键说明）
; 用法：复制本文件为 collector.ini 后按现场修改；collector.ini 不入库，本模板随仓库更新。
; 与 ConfigManager.go 读写键全量对齐。布尔值接受 true/false/True/False。

[main]
title      = 采集系统
opc_server = Freelance2000OPCServer.42.1   ; 描述性元数据，仅启动时展示，不参与采集逻辑
web_token  =                               ; Web/API 访问令牌，空=不启用鉴权；生成: openssl rand -hex 32；未设置时启动打安全警告
web_bind   =                               ; Web 监听地址，空=0.0.0.0 全网卡；建议 127.0.0.1 或内网管理 IP；仅重启生效

[mqtt]
enabled               = false
broker                = 192.168.1.100
port                  = 1883
topic                 = opc/data
username              =                     ; broker 要求认证时填写
password              =                     ; Web UI 可配置；GET /api/config 回读 ***（写回 *** 表示不修改）
client_id             =                     ; 留空自动生成 opc_<hostname>_<pid>
qos                   = 1
retain                = false
format                = full                ; full=整包JSON | flat=仅values | 自定义模板 {key},{value},{quality},{timestamp}
split                 = false               ; false=全部点合并一包发出 | true=每点单独一条
js_transform          =                     ; 可选 JS 表达式，变量 point={key,value,quality,timestamp}
tls_enabled           = false               ; true=用 ssl:// 连接（通常 8883）
tls_insecure_skip_verify = false            ; 跳过 TLS 证书校验（现场自签证书应急，生产保持 false）

; 数据源：[http1] [http2] ... 段名必须为 http+数字（[http] 单数为旧配置兼容键）
; url 含 /api/stream 走 SSE 长连接（断线指数退避重连），否则 HTTP 定时轮询
[http1]
name    = 数据源1
enabled = true
url     = http://192.168.1.100:8080/api/stream
method  = GET
timeout = 30000
token   =                                   ; 目标 C# 代理的 api_token，空=不附加 X-Api-Token 头

[http2]
name    = 数据源2
enabled = false
url     = http://192.168.1.101:8080/api/stream
method  = GET
timeout = 30000
token   =

; RTDB：KairosDB telnet 行协议；host 逗号分隔多地址=同批双写（部分不可达保留其余）
[rtdb]
enabled = false
host    = 192.168.1.200
port    = 8100
format  = put {key} {timestamp} {value} device={device} component={component}
debug   = false                             ; true=每批打印发送内容（排查用，高频刷屏）

[webhook]
enabled = false
url     =
events  = mqtt_error,http_error,collect_error

; 任务：[task1] [task2] ... 段名必须为 task+数字
; http_source 对应 [httpN] 的 name；空=使用全部启用的数据源
; tag_opcN/tag_dbnN 可选：OPC 点名→目标字段名映射（未列出的点按转换规则/原名）
[task1]
task                = true
http_source         = 数据源1
job_interval_second = 1
tag_opc1            = Channel1.Device1.Tag1
tag_dbn1            = device1_value
